[project]
name = "throttlekit"
version = "0.1.0"
description = "Plug-and-play rate limiting middleware for FastAPI and Flask."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "ThrottleKit Contributor", email = "hello@example.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
    "Framework :: Flask",
]

dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi", "uvicorn"]
flask = ["flask"]
redis = ["redis"]
docs = ["mkdocs-material", "mkdocstrings[python]"]
test = ["pytest", "requests", "httpx", "flask", "fastapi", "uvicorn"]

[project.urls]
Homepage = "https://github.com/example/throttlekit"
Repository = "https://github.com/example/throttlekit"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
